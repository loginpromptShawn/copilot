[app]
name = CopilotApp
environment = macos

[paths]
data_dir = /Users/bong/VSCode/copilot/data
log_rotation_bytes = 5242880

[auth]
token_expiry_hours = 8
password_hash_algorithm = sha256

[rate_limit]
strategy = token_bucket
capacity = 100
refill_rate = 10

[resilience.user_service]
max_attempts = 3
backoff_strategy = exponential
base_delay = 0.2
max_delay = 2.0
max_concurrent = 5
queue_size = 10

[resilience.system_service]
max_attempts = 2
backoff_strategy = fixed
base_delay = 0.1
max_delay = 1.0
max_concurrent = 3
queue_size = 5
